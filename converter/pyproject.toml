[project]
name = "converter"
version = "0.1.0"
description = "XLSX to XLS file converter service"
authors = [{ name = "Vladimir Nagibin", email = "vlnagibin@yandex.ru" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "boutique-common",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic-settings>=2.6.1",
    "python-multipart>=0.0.9",
    "xlwt==1.3.0",
    "pandas==1.5.3",
    "numpy==1.23.5",
    "openpyxl==3.1.5",
    "redis>=5.0.4",
    "aiofiles>=24.1.0",
    "apscheduler==3.11.0",
    "python-json-logger>=4.1.0",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-subtests==0.11.0",
    "ruff>=0.14.11",
    "pre-commit>=4.1.0",
    "types-aiofiles>=24.1.0.20241221",
    "types-redis>=4.6.0.20241004",
    "pandas-stubs>=2.0.0",
    "taskipy>=1.14.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false

[tool.uv.sources]
# Не editable: пакет попадает в site-packages (удобно для Docker multi-stage)
boutique-common = { path = "../common" }

# ===== Ruff =====
[tool.ruff]
line-length = 79
target-version = "py311"
output-format = "grouped"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "RUF",
    "ASYNC",
    "S",
    "BLE",
]
ignore = [
    "S101",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "db", "services", "common"]
combine-as-imports = true
force-wrap-aliases = true
lines-after-imports = 2
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ===== Pytest =====
[tool.pytest.ini_options]
norecursedirs = ["env/*", "venv/*"]
addopts = [
    "-vv",
    "-p",
    "no:cacheprovider",
    "--strict-markers",
]
testpaths = ["tests", "functional"]
python_files = ["test_*.py"]
markers = [
    "test",
    "core",
]
asyncio_mode = "auto"

# ===== Mypy =====
[tool.mypy]
strict = true
mypy_path = ["converter/src", "."]
files = ["converter/src"]
exclude = [
    "^price_flow/.*",
    "^updating_sites/.*",
    "^src/migrations/.*",
    "^migrations/.*",
]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "pandas",
    "pandas.*",
    "openpyxl",
    "openpyxl.*",
    "pythonjsonlogger",
    "pythonjsonlogger.*",
    "apscheduler",
    "apscheduler.*",
    "uvicorn",
    "uvicorn.*",
    "xlwt",
    "xlwt.*",
]
ignore_missing_imports = true

# ===== Taskipy =====
[tool.taskipy.tasks]
lint = "ruff check ."
format = "ruff format ."
fix = "ruff check --fix ."
check = "ruff check . && mypy --config-file=pyproject.toml ."
test = "pytest -v"
run = "PYTHONPATH=src:.. uv run src/main.py"
install = "uv sync"
install-dev = "uv sync --group dev"
clean = "rm -rf .mypy_cache .pytest_cache .ruff_cache __pycache__ *.pyc"
