# CLEF для Seq. Файл подключается в http (conf.d), не в server.
map $status $seq_level {
    ~^5     "Error";
    ~^4     "Warning";
    default "Information";
}

log_format seq_clef escape=json
    '{"@t":"$time_iso8601","@l":"$seq_level",'
    '"@mt":"{RequestMethod} {RequestUri} {Status}",'
    '"Application":"gateway","Logger":"gateway",'
    '"RequestMethod":"$request_method",'
    '"RequestUri":"$request_uri",'
    '"Status":$status,'
    '"RemoteAddr":"$remote_addr",'
    '"Host":"$host",'
    '"UserAgent":"$http_user_agent",'
    '"RequestTime":$request_time,'
    '"Upstream":"$upstream_addr",'
    '"UpstreamStatus":"$upstream_status"}';
