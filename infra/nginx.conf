server {
    listen 80;
    server_tokens off;
    client_max_body_size 50M;

    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;

    # ===== Прокси для price_flow =====

    # ----- 1. Прокси для админки price_flow (прямой доступ)-----
    #          http://ваш-ip/price/admin/
    location /price/admin/ {
        proxy_pass http://price_flow:8000/admin/;

        # 1. Передаем точный хост и порт, которые видит клиент
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host; # Критично для генерации URL в FastAPI

        # 2. ЖЕСТКИЙ перехват абсолютных редиректов от Docker-контейнера
        # Если бэкенд вернет http://price_flow:8000/admin/..., мы заменим это на /price/admin/...
        proxy_redirect http://price_flow:8000/admin/ /price/admin/;
        proxy_redirect http://price_flow:8000/ /price/;

        # 3. Перехват относительных редиректов (оставляем как страховку)
        proxy_redirect ~^/admin(/.*)?$ /price/admin$1;
        proxy_redirect ~^/static(/.*)?$ /price/static$1;

        # 4. Исправление пути для Cookie (КРИТИЧЕСКИ ВАЖНО для сессий SQLAdmin)
        proxy_cookie_path /admin/ /price/admin/;
        proxy_cookie_path / /price/admin/;

        # 5. Подмена ссылок в HTML, CSS, JS
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript;
        sub_filter '/admin/' '/price/admin/';
        sub_filter '/static/' '/price/static/';
    }

    location /admin/ {
        return 301 /price$request_uri;
    }

    # ---- 2. Страница документации price_flow (HTML) ----
    location /price/api/openapi {
        proxy_pass http://price_flow:8000/api/openapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";

        # Исправляем редиректы (если есть)
        proxy_redirect /api/openapi.json /price/api/openapi.json;
        proxy_redirect /openapi.json /price/api/openapi.json;

        # Подменяем ссылки в HTML/JS/CSS
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/css;
        sub_filter '/api/openapi.json' '/price/api/openapi.json';
        sub_filter '/openapi.json' '/price/api/openapi.json';
    }

    # ---- JSON-спецификация OpenAPI price_flow ----
    location /price/api/openapi.json {
        proxy_pass http://price_flow:8000/api/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- 3. Прокси для сервиса price_flow (всё остальное) -----
    #          http://ваш-ip/price/ -> price_flow:8000/
    location /price/ {
        proxy_pass http://price_flow:8000/api/v1/;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
        # Если нужен WebSocket, добавьте:
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
        proxy_redirect http://price_flow:8000/api/v1/ /price/;
        proxy_redirect http://price_flow:8000/admin/ /price/admin/;
        # или общий паттерн:
        proxy_redirect ~^http://price_flow:8000/api/v1/(.*)$ /price/$1;
    }

    # ===== Прокси для upd_sites =====

    # ----- 1. Прокси для админки upd_sites (прямой доступ) -----
    #          http://ваш-ip/api/v1/tiny/admin/db/
    # location /upd/admin/ {
    #     proxy_pass http://upd_sites:8000/api/v1/tiny/admin/db/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;

    #     # Подмена абсолютных ссылок в ответах
    #     sub_filter_once off;
    #     sub_filter_types text/html application/javascript text/css;
    #     sub_filter '/api/v1/tiny/admin/db/' '/upd/admin/';

    #     # Если нужен редирект на префикс тоже подменять
    #     proxy_redirect http://upd_sites:8000/api/v1/tiny/admin/db/ /upd/admin/;
    # }

    # ---- 2. Страница документации upd_sites (HTML) ----
    location /upd/api/openapi {
        proxy_pass http://upd_sites:8000/api/openapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";

        # Исправляем редиректы (если есть)
        proxy_redirect /api/openapi.json /upd/api/openapi.json;
        proxy_redirect /openapi.json /upd/api/openapi.json;

        # Подменяем ссылки в HTML/JS/CSS
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/css;
        sub_filter '/api/openapi.json' '/upd/api/openapi.json';
        sub_filter '/openapi.json' '/upd/api/openapi.json';
    }

    # ---- JSON-спецификация OpenAPI upd_sites ----
    location /upd/api/openapi.json {
        proxy_pass http://upd_sites:8000/api/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- 3. Прокси для сервиса upd_sites (всё остальное) -----
    #          http://ваш-ip/upd/ -> upd_sites:8000/
    location /upd/ {
        proxy_pass http://upd_sites:8000/api/v1/;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";

        proxy_redirect /api/v1/ /upd/;

        # Подмена ссылок в теле ответа (HTML, JS, CSS)
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/css;
        sub_filter '/api/v1/' '/upd/';
    }

    # ===== Прокси для converter =====

    # ---- 1. Страница документации converter (HTML) ----
    location /converter/api/openapi {
        proxy_pass http://converter:8000/api/openapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";

        # Исправляем редиректы (если есть)
        proxy_redirect /api/openapi.json /converter/api/openapi.json;
        proxy_redirect /openapi.json /converter/api/openapi.json;

        # Подменяем ссылки в HTML/JS/CSS
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/css;
        sub_filter '/api/openapi.json' '/converter/api/openapi.json';
        sub_filter '/openapi.json' '/converter/api/openapi.json';
    }

    # ---- JSON-спецификация OpenAPI ----
    location /converter/api/openapi.json {
        proxy_pass http://converter:8000/api/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- 3. Прокси для сервиса converter (всё остальное) -----
    #          http://ваш-ip/converter/ -> converter:8000/
    location /converter/ {
        proxy_pass http://converter:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== Прокси для Seq (веб-интерфейс логирования) =====
    #       http://ваш-ip/seq/ -> seq:80/
    location /seq/ {
        proxy_pass http://seq:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Для Seq может потребоваться дополнительный заголовок:
        # proxy_set_header X-Forwarded-Host $host;
        # proxy_set_header X-Forwarded-Port $server_port;
    }

    # ===== Корневой путь – можно отдать заглушку или редирект =====
    location / {
    root /usr/share/nginx/html;
    try_files /index.html =404;
}
}
