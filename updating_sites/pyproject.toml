[project]
name = "updating-sites"
version = "0.1.0"
description = "Portal update and Dropbox sync service"
authors = [{ name = "Vladimir Nagibin", email = "vlnagibin@yandex.ru" }]
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "boutique-common",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic-settings>=2.6.1",
    "pydantic>=2.10.5",
    "python-multipart>=0.0.20",
    "sshtunnel==0.4.0",
    "paramiko==2.12.0",
    "sqlalchemy>=2.0.36,<2.1",
    "pymysql==1.1.1",
    "pandas>=3.0.0,<3.0.4",
    "dropbox==12.2.0",
    "python-dotenv>=1.0.1",
    "tinydb==4.8.2",
    "jinja2>=3.1.6",
    "cryptography>=45.0.4",
    "python-json-logger>=4.1.0",
    "requests>=2.33.1",
    "aiofiles>=25.1.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.4.0",
    "bcrypt>=4.0.1,<5",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "ruff>=0.14.11",
    "pre-commit>=4.1.0",
    "types-aiofiles>=25.1.0.20251011",
    "types-requests>=2.32.4.20260107",
    "types-paramiko>=3.5.0",
    "pandas-stubs>=2.2.2",
    "taskipy>=1.14.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false

[tool.uv.sources]
# Не editable: пакет попадает в site-packages (удобно для Docker multi-stage)
boutique-common = { path = "../common" }

# ===== Ruff =====
[tool.ruff]
line-length = 79
target-version = "py313"
output-format = "grouped"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "RUF",
    "ASYNC",
    "S",
    "BLE",
]
ignore = [
    "S101",
    "B008",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"src/core/settings.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "core",
    "middleware",
    "models",
    "repositories",
    "schemas",
    "services",
    "common",
]
combine-as-imports = true
force-wrap-aliases = true
lines-after-imports = 2
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ===== Pytest =====
[tool.pytest.ini_options]
norecursedirs = ["env/*", "venv/*"]
addopts = [
    "-vv",
    "-p",
    "no:cacheprovider",
    "--strict-markers",
]
testpaths = ["tests", "functional"]
python_files = ["test_*.py"]
markers = [
    "test",
    "core",
]
asyncio_mode = "auto"

# ===== Mypy =====
[tool.mypy]
strict = true
mypy_path = ["updating_sites/src", "."]
files = ["updating_sites/src"]
exclude = [
    "^price_flow/.*",
    "^converter/.*",
    "^src/migrations/.*",
    "^migrations/.*",
]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "pandas",
    "pandas.*",
    "openpyxl",
    "openpyxl.*",
    "pythonjsonlogger",
    "pythonjsonlogger.*",
    "uvicorn",
    "uvicorn.*",
    "dropbox",
    "dropbox.*",
    "sshtunnel",
    "sshtunnel.*",
    "paramiko",
    "paramiko.*",
    "tinydb",
    "tinydb.*",
    "passlib",
    "passlib.*",
    "jose",
    "jose.*",
    "pymysql",
    "pymysql.*",
]
ignore_missing_imports = true

# ===== Taskipy =====
[tool.taskipy.tasks]
lint = "ruff check ."
format = "ruff format ."
fix = "ruff check --fix ."
check = "ruff check . && mypy --config-file=pyproject.toml ."
test = "pytest -v"
run = "PYTHONPATH=src:.. uv run src/main.py"
install = "uv sync"
install-dev = "uv sync --group dev"
clean = "rm -rf .mypy_cache .pytest_cache .ruff_cache __pycache__ *.pyc"
